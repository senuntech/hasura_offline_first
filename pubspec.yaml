name: hasura_offline_first
description: Local-First and offline-first GraphQL client compatible with HasuraConnect, featuring an embedded SQLite replica, schema auto-migrations, and server authority conflict resolution.
version: 1.1.1
repository: https://github.com/senuntech/hasura_offline_first
issue_tracker: https://github.com/senuntech/hasura_offline_first/issues

topics:
  - graphql
  - hasura
  - offline-first
  - cache
  - connectivity

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.2
  crypto: ^3.0.3
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  uuid: ^4.4.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
